# .github/workflows/ci.yml
name: AI Agent CI/CD — Final Working Version

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      reportportal:
        image: reportportal/service-ui:5.14.2
        ports:
          - 8080:8080
        env:
          RP_ENABLE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Mock Server (with proper delay)
        run: |
          echo "Starting UPI Mock Server..."
          node server.js > mock-server.log 2>&1 &
          MOCK_PID=$!
          echo "Mock server PID: $MOCK_PID"

          # Wait for WebSocket port to be open (critical!)
          echo "Waiting for WebSocket on port 8765..."
          for i in {1..30}; do
            if curl -f http://localhost:3000/health >/dev/null 2>&1; then
              echo "Health check passed! Server ready."
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Mock server failed to start!"
              cat mock-server.log
              exit 1
            fi
            sleep 2
          done

          # Extra: wait for WebSocket specifically
          npx wait-on ws://localhost:8765 --timeout 30000

      - name: Wait for ReportPortal
        run: |
          for i in {1..40}; do
            if curl -f http://localhost:8080/api/v1/user > /dev/null 2>&1; then
              echo "ReportPortal ready!"
              break
            fi
            sleep 5
          done

      - name: Run Tests
        run: |
          mvn clean test -B \
            -Dwebsocket.url=ws://localhost:8765 \
            -Dreportportal.enabled=true \
            -Dreportportal.endpoint=http://localhost:8080 \
            -Dreportportal.api.key=superadmin \
            -Dreportportal.project=default_personal \
            -Dreportportal.launch="CI #${{ github.run_number }}"

      - name: Generate & Upload Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Show Mock Server Logs on Failure
        if: failure()
        run: cat mock-server.log || true
