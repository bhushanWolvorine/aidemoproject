# .github/workflows/ci.yml
name: AI Agent

on:
  push:
    branches: [ main, develop, allure ]
  pull_request:
    branches: [ main, develop, allure ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Mock Server
        run: npm ci

      - name: Start Mock Server
        run: |
          npm start > mock.log 2>&1 &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -f http://localhost:3000/health && break
            sleep 2
          done
          for i in {1..30}; do
            echo | ncat -w 1 localhost 8765 && break
            sleep 2
          done

      - name: Install Allure CLI
        run: |
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip -q allure.zip -d ~/allure
          echo "$HOME/allure/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Run Tests
        run: mvn clean test -B

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: ${{ github.ref_name == 'refs/heads/allure' && 'allure' || '' }}