name: AI Agent CI/CD — Final & Perfect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      reportportal:
        image: reportportal/service-ui:5.14.2
        ports:
          - 8080:8080
        env:
          RP_ENABLE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Mock Server Dependencies
        run: npm ci

      - name: Start Mock Server
        run: |
          npm start > mock-server.log 2>&1 &
          echo "Mock server started"

          echo "Waiting for health endpoint..."
          for i in {1..30}; do
            if curl -f http://localhost:3000/health >/dev/null 2>&1; then
              echo "HTTP ready!"
              break
            fi
            sleep 2
          done

          echo "Waiting for WebSocket..."
          for i in {1..30}; do
            if echo | ncat -w 1 localhost 8765 >/dev/null 2>&1; then
              echo "WebSocket ready!"
              break
            fi
            sleep 2
          done

      - name: Wait for ReportPortal
        run: |
          for i in {1..40}; do
            if curl -f http://localhost:8080/api/v1/user >/dev/null 2>&1; then
              echo "ReportPortal ready!"
              break
            fi
            sleep 5
          done

      - name: Install Allure CLI
        run: |
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip -q allure.zip -d ~/allure
          echo "$HOME/allure/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Run Tests
        run: |
          mvn clean test -B \
            -Dwebsocket.url=ws://localhost:8765 \
            -Dreportportal.enabled=true \
            -Dreportportal.endpoint=http://localhost:8080 \
            -Dreportportal.api.key=superadmin \
            -Dreportportal.project=default_personal \
            -Dreportportal.launch="CI #${{ github.run_number }}"

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Show Mock Server Logs on Failure
        if: failure()
        run: cat mock-server.log
