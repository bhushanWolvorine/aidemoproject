name: AI Agent

on:
  push:
    branches: [ main, develop, allure ]
  pull_request:
    branches: [ main, develop, allure ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Mock Server Dependencies
        run: npm ci

      - name: Start Mock Server
        run: |
          echo "Starting UPI Mock Server..."
          npm start > mock-server.log 2>&1 &
          PID=$!
          echo "Mock server PID: $PID"

          # Wait for HTTP health
          echo "Waiting for http://localhost:3000/health..."
          npx wait-on http://localhost:3000/health --timeout 30000

          # Wait for WebSocket
          echo "Waiting for ws://localhost:8765..."
          npx wait-on ws://localhost:8765 --timeout 30000

          echo "Mock server 100% ready!"

      - name: Install Allure CLI
        run: |
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip -q allure.zip -d ~/allure
          echo "$HOME/allure/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Run Tests
        run: mvn clean test -B

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: target/allure-report
          retention-days: 30

      - name: Deploy to GitHub Pages (on main branch only)
        if: success() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report

      - name: Show Mock Server Logs on Failure
        if: failure()
        run: cat mock-server.log