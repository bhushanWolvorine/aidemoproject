name: AI Agent

on:
  push:
    branches: [ main, develop, allure ]
  pull_request:
    branches: [ main, develop, allure ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Mock Server Dependencies
        run: npm ci

      - name: Start Mock Server
        run: |
          npm start > mock-server.log 2>&1 &
          echo "Waiting for mock server..."
          for i in {1..30}; do curl -f http://localhost:3000/health && break; sleep 2; done
          for i in {1..30}; do echo | ncat -w 1 localhost 8765 && break; sleep 2; done
          echo "Mock server ready!"

      - name: Install Allure CLI
        run: |
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip -q allure.zip -d ~/allure
          echo "$HOME/allure/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Run Tests with Allure
        run: mvn clean test -B

      - name: Debug — List Allure Results
        if: always()
        run: |
          echo "=== ALLURE RESULTS COUNT ==="
          find target/allure-results -name "*.json" | wc -l || echo "0 files"
          echo "=== FIRST 10 FILES ==="
          ls -la target/allure-results/ | head -10 || echo "No files"

      # THIS IS THE ONLY CHANGE YOU NEED (handles Allure 2.27+ structure)
      - name: Generate Allure Report (Fixed for Allure 2.27+)
        if: always()
        run: |
          allure generate target/allure-results --clean -o target/allure-report

          # Move index.html, app.js, styles.css from widgets/ to root
          if [ -d "target/allure-report/widgets" ]; then
            cp -r target/allure-report/widgets/* target/allure-report/
            rm -rf target/allure-report/widgets
          fi

          # If old data/ folder exists (fallback), flatten it too
          if [ -d "target/allure-report/data" ]; then
            cp -r target/allure-report/data/* target/allure-report/ 2>/dev/null || true
            rm -rf target/allure-report/data
          fi

      - name: Upload Allure Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN_DEMO }}
          publish_dir: target/allure-report
          commit_message: "Allure Report — Run #${{ github.run_number }}"
          force_orphan: true
          keep_files: false

      - name: Show Mock Server Logs on Failure
        if: failure()
        run: cat mock-server.log || true