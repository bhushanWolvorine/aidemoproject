# .github/workflows/ci.yml
name: AI Agent CI/CD — Final & Perfect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      reportportal:
        image: reportportal/service-ui:5.14.2
        ports:
          - 8080:8080
        env:
          RP_ENABLE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Mock Server Dependencies
        run: npm ci  # ← Uses your package.json + package-lock.json (fast & safe)

      - name: Start Mock Server
        run: |
          echo "Starting UPI Mock Server..."
          npm start > mock-server.log 2>&1 &
          MOCK_PID=$!
          echo "PID: $MOCK_PID"

          # Wait for HTTP health
          npx wait-on http://localhost:3000/health --timeout 30000

          # Wait for WebSocket
          npx wait-on ws://localhost:8765 --timeout 30000

          echo "Mock server 100% ready!"

      - name: Wait for ReportPortal
        run: |
          for i in {1..40}; do
            if curl -f http://localhost:8080/api/v1/user > /dev/null 2>&1; then
              echo "ReportPortal ready!"
              break
            fi
            sleep 5
          done

      - name: Run Full Test Suite
        run: |
          mvn clean test -B \
            -Dwebsocket.url=ws://localhost:8765 \
            -Dreportportal.enabled=true \
            -Dreportportal.endpoint=http://localhost:8080 \
            -Dreportportal.api.key=superadmin \
            -Dreportportal.project=default_personal \
            -Dreportportal.launch="CI #${{ github.run_number }} — ${{ github.ref_name }}"

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Deploy to GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report

      - name: Show Mock Server Logs on Failure
        if: failure()
        run: cat mock-server.log
