# .github/workflows/ci.yml
name: AI Agent CI/CD — Full Validation (Self-Contained)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Services — your mock server + ReportPortal
    services:
      # 1. UPI Mock Server (Node.js)
      mock-server:
        image: node:18-alpine
        ports:
          - 8765:8765
        volumes:
          - ./server.js:/app/server.js
        command: ["sh", "-c", "cd /app && node server.js"]
        options: >-
          --health-cmd "curl -f http://localhost:3000/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # 2. ReportPortal (lightweight)
      reportportal:
        image: reportportal/service-ui:5.14.2
        ports:
          - 8080:8080
        env:
          RP_ENABLE: "true"
        options: >-
          --health-cmd "curl -f http://localhost:8080/api/v1/user || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Wait for Mock Server
        run: |
          echo "Waiting for mock server..."
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "Mock server ready!"
              break
            fi
            sleep 2
          done

      - name: Wait for ReportPortal
        run: |
          echo "Waiting for ReportPortal..."
          for i in {1..40}; do
            if curl -f http://localhost:8080/api/v1/user > /dev/null 2>&1; then
              echo "ReportPortal ready!"
              break
            fi
            sleep 5
          done

      - name: Run Full Test Suite → Upload to ReportPortal
        run: |
          mvn clean test -B \
            -Dwebsocket.url=ws://localhost:8765 \
            -Dreportportal.enabled=true \
            -Dreportportal.endpoint=http://localhost:8080 \
            -Dreportportal.api.key=superadmin \
            -Dreportportal.project=default_personal \
            -Dreportportal.launch="CI #${{ github.run_number }} — ${{ github.ref_name }}" \
            -Dreportportal.attributes=ci:github;run:${{ github.run_id }}

      - name: Generate Allure Report (Backup)
        if: always()
        run: |
          allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: target/allure-report
          retention-days: 30

      - name: Deploy Allure to GitHub Pages (on main)
        if: success() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report

      - name: Fail CI if Tests Failed
        if: failure()
        run: |
          echo "AI AGENT VALIDATION FAILED — BLOCKING DEPLOYMENT"
          exit 1
