# .github/workflows/ci.yml
name: AI Agent — Allure Only (FINAL & BULLETPROOF)

on:
  push:
    branches: [ main, develop, allure ]
  pull_request:
    branches: [ main, develop, allure ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # ← Critical: fixes wait-on warnings
          cache: 'npm'

      - name: Install Mock Server Dependencies
        run: npm ci

      - name: Start Mock Server
        run: |
          echo "Starting UPI Mock Server..."
          npm start > mock-server.log 2>&1 &
          PID=$!
          echo "Mock server PID: $PID"

          # Wait for HTTP health (fast)
          echo "Waiting for HTTP health..."
          for i in {1..30}; do
            if curl -f http://localhost:3000/health >/dev/null 2>&1; then
              echo "HTTP ready!"
              break
            fi
            sleep 2
          done

          # Wait for WebSocket port using ncat (built-in, instant)
          echo "Waiting for WebSocket on port 8765..."
          for i in {1..30}; do
            if echo | ncat -w 1 localhost 8765 >/dev/null 2>&1; then
              echo "WebSocket ready!"
              break
            fi
            sleep 2
          done

          echo "Mock server 100% ready!"

      - name: Install Allure CLI
        run: |
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          unzip -q allure.zip -d ~/allure
          echo "$HOME/allure/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Run Tests
        run: mvn clean test -B

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: target/allure-report

      - name: Deploy to GitHub Pages (main + allure branch)
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/allure')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: ${{ github.ref_name }}   # main → root, allure → /allure

      - name: Show Mock Server Logs on Failure
        if: failure()
        run: cat mock-server.log