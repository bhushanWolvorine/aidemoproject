# .github/workflows/ci.yml
name: AI Agent CI/CD — Full Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # ReportPortal — lightweight UI-only (fast)
      reportportal:
        image: reportportal/service-ui:5.14.2
        ports:
          - 8080:8080
        env:
          RP_ENABLE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Start your mock server as a background process (no services needed)
      - name: Start UPI Mock Server
        run: |
          echo "Starting mock server..."
          node server.js > mock-server.log 2>&1 &
          echo "Mock server started (PID: $!)"

      - name: Wait for Mock Server Health
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "Mock server ready!"
              break
            fi
            sleep 2
          done

      - name: Wait for ReportPortal
        run: |
          for i in {1..40}; do
            if curl -f http://localhost:8080/api/v1/user > /dev/null 2>&1; then
              echo "ReportPortal ready!"
              break
            fi
            sleep 5
          done

      - name: Run Full Test Suite → Upload to ReportPortal
        run: |
          mvn clean test -B \
            -Dwebsocket.url=ws://localhost:8765 \
            -Dreportportal.enabled=true \
            -Dreportportal.endpoint=http://localhost:8080 \
            -Dreportportal.api.key=superadmin \
            -Dreportportal.project=default_personal \
            -Dreportportal.launch="CI #${{ github.run_number }}"

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      - name: Deploy to GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report

      - name: Show Mock Server Logs (on failure)
        if: failure()
        run: cat mock-server.log || true
